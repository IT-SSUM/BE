spring:
  application:
    name: itssum

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      # 엔티티가 스키마의 원본이다 (Flyway·schema.sql 없음). 설계 기준: docs/erd/itssum_erd_v3.sql
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

  # 인증 메일 발송 (Gmail SMTP). 비밀번호는 Gmail 앱 비밀번호, 둘 다 환경변수로만 받는다
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # STARTTLS 를 못 쓰면 평문으로 넘어가지 않고 연결을 끊는다
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

management:
  endpoints:
    web:
      exposure:
        # CD 배포 확인용. health 외 actuator 엔드포인트는 노출하지 않는다.
        include: health

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

jwt:
  # HS256 서명 키. 환경변수로만 받는다 (32바이트 이상, 커밋 금지)
  secret: ${JWT_SECRET}
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:30m}
  refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:14d}

auth:
  # 회원가입 때 terms_agreements.terms_version 에 기록하는 약관 버전
  terms-version: v1
  email-verification:
    code-ttl: 5m
    resend-cooldown: 60s
    max-attempts: 5
    token-ttl: 30m

# 국세청 사업자등록정보 진위확인 (공공데이터포털). 서비스키는 디코딩 키를 환경변수로만 받는다
nts:
  base-url: https://api.odcloud.kr/api/nts-businessman/v1
  service-key: ${NTS_SERVICE_KEY:}
  timeout: 5s
