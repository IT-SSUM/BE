spring:
  application:
    name: itssum

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      # 엔티티가 스키마의 원본이다 (Flyway·schema.sql 없음). 설계 기준: docs/erd/itssum_erd_v3.sql
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

management:
  endpoints:
    web:
      exposure:
        # CD 배포 확인용. health 외 actuator 엔드포인트는 노출하지 않는다.
        include: health

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

jwt:
  # HS256 서명 키. 환경변수로만 받는다 (32바이트 이상, 커밋 금지)
  secret: ${JWT_SECRET}
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:30m}
  refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:14d}
