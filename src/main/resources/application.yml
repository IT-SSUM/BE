spring:
  application:
    name: itssum

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      # 엔티티가 스키마의 원본이다 (Flyway·schema.sql 없음). 설계 기준: docs/erd/itssum_erd_v3.sql
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

management:
  endpoints:
    web:
      exposure:
        # CD 배포 확인용. health 외 actuator 엔드포인트는 노출하지 않는다.
        include: health
