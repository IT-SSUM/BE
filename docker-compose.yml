# EC2에서 앱 컨테이너를 기동하는 구성.
# 실제 값(이미지 태그, DB 접속정보)은 같은 폴더의 .env 를 CD 워크플로우가 생성해 주입한다.
services:
  app:
    image: ${DOCKER_IMAGE}          # 예: <dockerhub-id>/itssum-be:<커밋 SHA>  (.env 에서 주입)
    container_name: itssum-be
    ports:
      # 외부 트래픽은 호스트 Nginx(80)만 받고, 앱은 Nginx를 통해서만 접근 → 127.0.0.1 바인딩으로 8080 직접노출 차단
      - "127.0.0.1:8080:8080"
    env_file:
      - .env                        # DB_* 주입
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 로그 시각을 KST로 맞춘다 (DB 저장 기준은 application.yml 의 hibernate time_zone)
      TZ: Asia/Seoul
      # FCM 푸시: 아래 secrets 로 연결한 서비스 계정 JSON을 Google 기본 자격 증명으로 읽는다
      FCM_ENABLED: "true"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account
    secrets:
      - firebase-service-account
    # 로그 파일이 디스크를 채우지 않도록 10MB x 5개로 순환
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

secrets:
  # CD 가 GitHub Secret(FIREBASE_SERVICE_ACCOUNT_BASE64)으로 같은 폴더에 만든다.
  # 컨테이너에는 /run/secrets/firebase-service-account 로 읽기 전용 마운트된다.
  firebase-service-account:
    file: ./firebase-service-account.json
